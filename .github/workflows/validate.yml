name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate manifests, skills, and evals
        run: node scripts/validate.mjs
      - name: Validate with the Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
